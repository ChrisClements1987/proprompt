# Dependabot configuration for proprompt

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "ChrisClements1987"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
